name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtshadertools

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: |
          $qtBin = "$env:Qt6_DIR\bin"
          & "$qtBin\windeployqt.exe" --qmldir qml --release build\Release\Ava.exe
          if (Test-Path "build\Release\AvaChat.exe") {
            & "$qtBin\windeployqt.exe" --qmldir qml\chat --release build\Release\AvaChat.exe
          }

      - name: Create portable zip
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path build\Release\* -DestinationPath "Ava-$tag-x64-portable.zip"

      - name: Build MSI installer
        run: |
          cd build
          cpack -C Release -G WIX

      - name: Find MSI artifact
        id: find_msi
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem -Path build -Filter "*.msi" | Select-Object -First 1
          $newName = "Ava-$tag-x64.msi"
          Copy-Item $msi.FullName $newName
          echo "msi_name=$newName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ava-${{ github.ref_name }}-x64-portable.zip
            ${{ steps.find_msi.outputs.msi_name }}
