name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            wix_arch: x64
          - arch: x86
            qt_arch: win32_msvc2022
            cmake_arch: Win32
            wix_arch: x86
          - arch: arm64
            qt_arch: win64_msvc2022_arm64
            cmake_arch: ARM64
            wix_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          arch: ${{ matrix.qt_arch }}
          modules: qtshadertools

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release
          -DCPACK_WIX_ARCHITECTURE=${{ matrix.wix_arch }}

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: |
          $qtBin = "$env:Qt6_DIR\bin"
          & "$qtBin\windeployqt.exe" --qmldir qml --release build\Release\Ava.exe
          if (Test-Path "build\Release\AvaChat.exe") {
            & "$qtBin\windeployqt.exe" --qmldir qml\chat --release build\Release\AvaChat.exe
          }

      - name: Create portable zip
        run: |
          $tag = "${{ github.ref_name }}"
          $arch = "${{ matrix.arch }}"
          Compress-Archive -Path build\Release\* -DestinationPath "Ava-$tag-$arch-portable.zip"

      - name: Build MSI installer
        run: |
          cd build
          cpack -C Release -G WIX

      - name: Find MSI artifact
        id: find_msi
        run: |
          $arch = "${{ matrix.arch }}"
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem -Path build -Filter "*.msi" | Select-Object -First 1
          $newName = "Ava-$tag-$arch.msi"
          Copy-Item $msi.FullName $newName
          echo "msi_name=$newName" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            Ava-${{ github.ref_name }}-${{ matrix.arch }}-portable.zip
            ${{ steps.find_msi.outputs.msi_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ava-*.zip
            Ava-*.msi
