name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Diagnostic job — lists available Qt 6.8 arches so failures can be debugged
  list-qt-arches:
    runs-on: windows-latest
    steps:
      - name: List available Qt 6.8 architectures
        run: |
          pip install aqtinstall
          python -m aqt list-qt windows desktop 6.8.3

  build:
    runs-on: windows-latest
    needs: list-qt-arches

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            cmake_generator: "Visual Studio 18 2026"
            cmake_arch: x64
            wix_arch: x64
            qt_modules: qtshadertools
          - arch: arm64
            # Qt 6 ARM64 Windows uses LLVM-MinGW toolchain
            qt_arch: win64_llvm_mingw
            cmake_generator: "Ninja"
            cmake_arch: ""
            wix_arch: arm64
            qt_modules: ""
          - arch: x86
            # Qt 6.8 dropped MSVC x86; use MinGW 32-bit via Qt 6.5 (last supported)
            qt_arch: win32_mingw
            cmake_generator: "Ninja"
            cmake_arch: ""
            wix_arch: x86
            qt_modules: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (for MinGW/LLVM builds)
        if: matrix.cmake_generator == 'Ninja'
        run: choco install ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.arch == 'x86' && '6.5.*' || '6.8.*' }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}

      - name: Configure CMake (MSVC)
        if: matrix.cmake_arch != ''
        run: >
          cmake -S . -B build
          -G "${{ matrix.cmake_generator }}"
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release
          -DCPACK_WIX_ARCHITECTURE=${{ matrix.wix_arch }}

      - name: Configure CMake (MinGW/LLVM)
        if: matrix.cmake_arch == ''
        run: >
          cmake -S . -B build
          -G "${{ matrix.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DCPACK_WIX_ARCHITECTURE=${{ matrix.wix_arch }}

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: |
          $qtBin = "$env:Qt6_DIR\bin"
          $exePath = if (Test-Path "build\Release\Ava.exe") { "build\Release\Ava.exe" } else { "build\Ava.exe" }
          & "$qtBin\windeployqt.exe" --qmldir qml --release $exePath
          $chatPath = if (Test-Path "build\Release\AvaChat.exe") { "build\Release\AvaChat.exe" } elseif (Test-Path "build\AvaChat.exe") { "build\AvaChat.exe" } else { "" }
          if ($chatPath) { & "$qtBin\windeployqt.exe" --qmldir qml\chat --release $chatPath }

      - name: Create portable zip
        run: |
          $tag = "${{ github.ref_name }}"
          $arch = "${{ matrix.arch }}"
          $srcDir = if (Test-Path "build\Release") { "build\Release\*" } else { "build\*" }
          Compress-Archive -Path $srcDir -DestinationPath "Ava-$tag-$arch-portable.zip"

      - name: Build MSI installer
        run: |
          cd build
          cpack -C Release -G WIX

      - name: Find and rename MSI artifact
        id: find_msi
        run: |
          $arch = "${{ matrix.arch }}"
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem -Recurse -Filter "*.msi" | Select-Object -First 1
          $newName = "Ava-$tag-$arch.msi"
          Copy-Item $msi.FullName $newName
          echo "msi_name=$newName" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            Ava-${{ github.ref_name }}-${{ matrix.arch }}-portable.zip
            ${{ steps.find_msi.outputs.msi_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ava-*.zip
            Ava-*.msi
